
name: CampusFind Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CampusFind Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Campus-Lost-and-Found
          push: false
          tags: campusfind:latest
